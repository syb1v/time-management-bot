name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest -q

  deploy:
    needs: test
    runs-on: [self-hosted, linux, x64, time-manager, production]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Docker service
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SOTKA_API_TOKEN: ${{ secrets.SOTKA_API_TOKEN }}
        run: |
          set -eu
          install -d -m 700 /opt/time-manager/data
          chown -R 10001:10001 /opt/time-manager/data
          umask 077
          {
            printf "BOT_TOKEN=%s\\n" "$BOT_TOKEN"
            printf "SOTKA_API_TOKEN=%s\\n" "$SOTKA_API_TOKEN"
            printf "DATABASE_URL=sqlite+aiosqlite:///data/time-manager.db\\n"
            printf "STUDENT_ID=1359806027\\nOWNER_ID=6499614618\\nTIMEZONE=Europe/Moscow\\n"
            printf "SCHOOL_SCHEDULE_PATH=raspisanie_11g.md\\nSOTKA_SCHEDULE_PATH=vebinary_sotka_sentyabr_2026.md\\nSOTKA_SYNC_DAYS=90\\n"
          } > /opt/time-manager/.env
          cd "$GITHUB_WORKSPACE"
          rsync -a --delete --exclude=data/ --exclude='*.har' --exclude=.env ./ /opt/time-manager/
          cd /opt/time-manager
          docker compose up -d --build --remove-orphans
          docker compose ps
          docker compose logs --no-color --tail=40 bot
